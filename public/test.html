<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{
font-family:"GG_light";
src:url("./TTF/경기천년제목_Light.ttf") format("truetype");
}
@font-face{
font-family:"GG_medium";
src:url("./TTF/경기천년제목_Medium.ttf") format("truetype");
}
@font-face{
font-family:"GG_bold";
src:url("./TTF/경기천년제목_Bold.ttf") format("truetype");
}
@font-face{
font-family:"GG_dd";
src:url("./TTF/경기천년제목V_Bold.ttf") format("truetype");
}

#font-test{
font-size:30px;
}
#font-test img{
height:1em;
}
.test1{
font-family:"GG_light";
}
.test2{
font-family:"GG_medium";
}
.test3{
font-family:"GG_bold";
}
.test4{
font-family:"GG_dd";
}

.standing{
	margin-right:-50px;
}
#standing{
display:flex;
align-items:flex-end;
font-size:20px;
text-align:center;
}
#status{
display:flex;
}
#status > div{
margin-right:10px;
}
</style>
</head>
<body>
<div id="font-test">
<div class="test1">te<img src="./assets/field-A.webp">st1</div>
<div class="test2">test2</div>
<div class="test3">test3</div>
<div class="test4">test4</div>
</div>
<div id="standing"></div>

<div>EX</div>
<div id="status"></div>


<script src="./students.js" charset="utf-8"></script>
<script src="./students_bio.js" charset="utf-8"></script>
<script src="./students_details.js" charset="utf-8"></script>
<script  charset="utf-8">
const standing = document.getElementById('standing')
//let students_bio = students_bio


for(var i=0; i<students_bio.length; i++){
	let name = students_bio[i].name.includes('*')
		? students_bio[i].name.split(' ')[1].replace('*', '_')
		: students_bio[i].name.split(' ')[1]

	let img_set = document.createElement('div')
	img_set.className = 'standing'
	let img_frame = document.createElement('img')
	img_frame.src = './assets/students/' + name + '/standing.webp'
	img_frame.height = students_bio[i].height * 2

	let height = document.createElement('div')
	height.innerText = students_bio[i].height + 'cm'

	img_set.appendChild(img_frame)
	img_set.appendChild(height)
	standing.appendChild(img_set)
}



const status = document.getElementById('status')

for(i=0; i<students_details.length; i++){
	students_bio.map(st => st.name === students_details[i].name ? students_details[i]['bio'] = st : null)
	let full_name = students_details[i].variant === "normal" ?
		students_details[i].name : 
		students_details[i].name + "(" + students_details[i].bio.variant[students_details[i].variant] + ")"

	let values = students_details[i]['skills']['ex'][0]['values1']['stats'].length > 1 ?
		students_details[i]['skills']['ex'][0]['values1']
		: students_details[i]['skills']['ex'][0]['values2']
	let value_ = values['stats']
/*
	let value_ = values['buff'] ? values['buff']
		: values['debuff'] ? values['debuff']
		: values['cost'] ? values['cost']
		: values['damage'] ? values['damage']
		: []
*/
	let stats_each = document.createElement('div')
	let s_name = document.createElement('div')
	s_name.innerText = full_name
	stats_each.appendChild(s_name)

	let skill_name = document.createElement('div')
	skill_name.innerText = values['type']
	stats_each.appendChild(skill_name)

	for(v=0; v<value_.length; v++){
		let status_detail = document.createElement("div")
		status_detail.innerText = value_[v]
		stats_each.appendChild(status_detail)
	}

	console.log(students_details[i]['skills']['ex'][0]['values1'])
	status.appendChild(stats_each)
}
//console.log(students_details[0]['skills']['ex'][0]['desc'])


</script>
</body>
</html>
